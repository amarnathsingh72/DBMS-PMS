<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PlacementPro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl mr-2">🎓</span>
                    <span class="font-bold text-xl tracking-tight">PlacementPro</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-indigo-100 text-sm">
                        Welcome, <strong th:text="${userId}" class="text-white">User</strong> 
                        (<span th:text="${role}">Role</span>)
                    </span>
                    <a th:href="@{/logout}" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1 rounded-md text-sm font-medium transition-colors">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <div class="bg-white overflow-hidden shadow-sm rounded-lg border border-slate-200">
            <div class="p-8 text-center">
                <h2 class="text-3xl font-bold text-slate-800 mb-4">Login Successful! 🎉</h2>
                <p class="text-slate-600 mb-8">You are securely logged into the Spring Boot web application using your MySQL database.</p>
                
                <div class="inline-block bg-indigo-50 border border-indigo-100 rounded-lg p-6 max-w-md">
                    <h3 class="text-lg font-semibold text-indigo-800 mb-2">Next Steps (Phase 3)</h3>
                    <ul class="text-left text-sm text-indigo-700 space-y-2 list-disc list-inside">
                        <li>Fetch Profile Data from DB</li>
                        <li>Build Quick Stat Cards</li>
                        <li>Implement Job Eligibility Engine</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
