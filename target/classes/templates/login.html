<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PlacementPro | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-10">
            <div class="text-5xl mb-4">🎓</div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">PlacementPro</h1>
            <p class="text-slate-500 mt-2">Sign in to your dashboard</p>
        </div>

        <!-- Role Selector (Demonstrating Java-style logic in Frontend) -->
        <form th:action="@{/login}" method="post" class="space-y-6">
            
            <div class="grid grid-cols-3 gap-2 mb-6">
                <button type="button" onclick="setRole('STUDENT')" id="btn-STUDENT" class="role-btn py-2 text-sm font-semibold rounded-lg border-2 border-indigo-600 bg-indigo-50 text-indigo-600 transition-all">Student</button>
                <button type="button" onclick="setRole('FACULTY')" id="btn-FACULTY" class="role-btn py-2 text-sm font-semibold rounded-lg border-2 border-transparent text-slate-500 hover:bg-slate-100 transition-all">Faculty</button>
                <button type="button" onclick="setRole('COMPANY')" id="btn-COMPANY" class="role-btn py-2 text-sm font-semibold rounded-lg border-2 border-transparent text-slate-500 hover:bg-slate-100 transition-all">Company</button>
            </div>

            <input type="hidden" name="role" id="roleInput" value="STUDENT">

            <div>
                <label id="idLabel" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">USN</label>
                <input type="text" name="username" required
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all placeholder-slate-300"
                       placeholder="e.g. 4SF24CI001">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all placeholder-slate-300"
                       placeholder="••••••••">
            </div>

            <!-- Error message from Java Controller -->
            <div th:if="${error}" class="p-3 rounded-lg bg-red-50 text-red-600 text-sm border border-red-100 animate-pulse">
                <span th:text="${error}">Error message here</span>
            </div>

            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95">
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-slate-400">
            &copy; 2026 PlacementPro — College Placement System
        </div>
    </div>

    <script>
        function setRole(role) {
            document.getElementById('roleInput').value = role;
            document.getElementById('idLabel').innerText = role === 'STUDENT' ? 'USN' : (role === 'FACULTY' ? 'Faculty ID' : 'Company ID');
            
            // Update UI buttons
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
                btn.classList.add('border-transparent', 'text-slate-500');
            });
            const activeBtn = document.getElementById('btn-' + role);
            activeBtn.classList.remove('border-transparent', 'text-slate-500');
            activeBtn.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-600');
        }
    </script>
</body>
</html>
