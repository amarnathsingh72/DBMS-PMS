<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard | PlacementPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-[#F4F6FA] min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#1E2A3B] text-white flex-shrink-0 flex flex-col fixed h-full z-20">
        <div class="p-6 flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-emerald-900/20">🏢</div>
            <span class="font-bold text-xl tracking-tight">PlacementPro</span>
        </div>
        
        <nav class="flex-1 mt-6 px-4 space-y-2">
            <button onclick="switchTab('jobs')" id="tab-jobs" class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-[#A8B9CC] hover:bg-white/5 transition-all">
                <span>📁</span> My Job Posts
            </button>
            <button onclick="switchTab('postjob')" id="tab-postjob" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-[#A8B9CC] hover:bg-white/5 transition-all">
                <span>➕</span> Post New Job
            </button>
        </nav>

        <div class="p-6 border-t border-white/5">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold text-xs" th:text="${companyName.substring(0,1)}">C</div>
                <div class="overflow-hidden">
                    <p class="text-xs font-bold truncate" th:text="${companyName}">Company</p>
                    <p class="text-[10px] text-[#64748B]">Company Account</p>
                </div>
            </div>
            <a th:href="@{/logout}" class="flex items-center gap-2 text-xs font-bold text-red-400 hover:text-red-300 transition-colors">
                <span>🚪</span> Sign Out
            </a>
        </div>
    </aside>

    <!-- Content Area -->
    <div class="flex-1 ml-64 flex flex-col min-h-screen">
        <!-- Top Bar -->
        <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-10 px-8 flex items-center justify-between">
            <h1 id="screen-title" class="text-xl font-extrabold text-slate-800 tracking-tight">Hiring Dashboard</h1>
            <div class="bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-100 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
                <span class="text-xs font-bold text-emerald-600 uppercase tracking-widest">Recruitment Active</span>
            </div>
        </header>

        <main class="p-8">
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
                <div class="lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover">
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Total Applicants</p>
                        <p class="text-4xl font-black text-indigo-600" th:text="${stats['totalApplicants']}">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover">
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Selections</p>
                        <p class="text-4xl font-black text-emerald-500" th:text="${stats['selected']}">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover">
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Pending Interviews</p>
                        <p class="text-4xl font-black text-violet-500" th:text="${stats['pendingInterviews']}">0</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <canvas id="hiringChart" height="150"></canvas>
                </div>
            </div>

            <!-- TAB: My Jobs -->
            <div id="panel-jobs" class="tab-panel">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-slate-100">
                        <thead class="bg-slate-50/50">
                            <tr>
                                <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Job Role</th>
                                <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Package</th>
                                <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Criteria</th>
                                <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Applicants</th>
                                <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            <tr th:each="job : ${jobs}" class="hover:bg-slate-50 transition-colors">
                                <td class="px-6 py-4">
                                    <p class="text-sm font-bold text-slate-800" th:text="${job.roleName}">Role</p>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase" th:text="${job.deadline}">Deadline</p>
                                </td>
                                <td class="px-6 py-4 text-sm font-black text-emerald-600" th:text="${job.packageLpa} + ' LPA'">LPA</td>
                                <td class="px-6 py-4">
                                    <p class="text-xs font-bold text-slate-600">CGPA: <span th:text="${job.minCgpa}">7.0</span></p>
                                    <p class="text-[10px] text-slate-400 truncate w-32" th:text="${job.allowedDepts}">Depts</p>
                                </td>
                                <td class="px-6 py-4 text-sm font-bold text-indigo-600" th:text="${job.eligibilityMessage}">0</td>
                                <td class="px-6 py-4">
                                    <a th:href="@{/company/applicants(jobId=${job.jobId})}" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-[10px] font-bold transition-colors">Review List →</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TAB: Post New Job -->
            <div id="panel-postjob" class="tab-panel hidden">
                <div class="max-w-2xl bg-white p-8 rounded-3xl shadow-xl shadow-slate-200 border border-slate-100">
                    <h2 class="text-xl font-black text-slate-800 mb-8">Create Job Opportunity</h2>
                    <form th:action="@{/company/post-job}" method="post" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Job Title</label>
                                <input type="text" name="roleName" required class="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition-all" placeholder="e.g. Software Engineer">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Deadline Date</label>
                                <input type="date" name="deadline" required class="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition-all">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Salary (LPA)</label>
                                <input type="number" step="0.01" name="packageLpa" required class="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition-all" placeholder="12.5">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Minimum CGPA</label>
                                <input type="number" step="0.1" name="minCgpa" required class="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition-all" placeholder="7.5">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Target Departments</label>
                            <input type="text" name="allowedDepts" required class="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-100 focus:border-emerald-500 outline-none transition-all" placeholder="CSE, ISE, ECE">
                        </div>

                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-5 rounded-2xl shadow-lg shadow-emerald-200 transition-all active:scale-[0.98] mt-4">Publish Job Post</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        function switchTab(tab) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('active');
            
            const titles = {
                'jobs': 'Recruitment Pipeline',
                'postjob': 'Create Opportunity'
            };
            document.getElementById('screen-title').innerText = titles[tab] || 'Dashboard';
        }

        // Hiring Pipeline Chart
        const ctx = document.getElementById('hiringChart').getContext('2d');
        new Chart(ctx, {
            type: 'polarArea',
            data: {
                labels: ['Applicants', 'Pending', 'Hired'],
                datasets: [{
                    data: [
                        /*[[${stats['totalApplicants']}]]*/ 0, 
                        /*[[${stats['pendingInterviews']}]]*/ 0, 
                        /*[[${stats['selected']}]]*/ 0
                    ],
                    backgroundColor: ['#6366F1', '#A855F7', '#10B981']
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { r: { grid: { display: false }, ticks: { display: false } } }
            }
        });
    </script>
</body>
</html>
