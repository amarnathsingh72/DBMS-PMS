<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Reports | PlacementPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="/js/main.js" defer></script>
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-[#F4F6FA] min-h-screen">

    <!-- Top Bar -->
    <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-10 px-8 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a th:href="@{/faculty/dashboard}" class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center hover:bg-slate-200 transition-colors">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            </a>
            <h1 class="text-xl font-extrabold text-slate-800 tracking-tight">Placement Analytics</h1>
        </div>
        <div class="flex items-center gap-3">
            <a th:href="@{/faculty/reports/export}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-indigo-200 transition-all flex items-center gap-2">
                <span>📥</span> Export CSV
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-10 px-8">
        <div class="mb-12">
            <h2 class="text-3xl font-black text-slate-900 mb-2">Performance Overview</h2>
            <p class="text-slate-500 font-medium">Real-time data from the placement pipeline stored procedure.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Department Summary -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs">Departmental Breakdown</h3>
                    <span class="px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-[10px] font-black uppercase">Live</span>
                </div>
                <table class="min-w-full divide-y divide-slate-50">
                    <thead class="bg-slate-50/50"><tr>
                        <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase">Dept</th>
                        <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase">Placed</th>
                        <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase">Rate</th>
                        <th class="px-6 py-4 text-left text-[10px] font-black text-slate-400 uppercase">Avg (LPA)</th>
                    </tr></thead>
                    <tbody class="divide-y divide-slate-50">
                        <tr th:each="d : ${deptReport}" class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 text-sm font-bold text-slate-800" th:text="${d['Dept']}">Dept</td>
                            <td class="px-6 py-4 text-sm font-semibold text-slate-600">
                                <span th:text="${d['Placed_Students']}">0</span> / <span th:text="${d['Total_Students']}" class="text-slate-400">0</span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-2">
                                    <div class="w-16 bg-slate-100 rounded-full h-1.5">
                                        <div class="bg-indigo-600 h-1.5 rounded-full" th:style="'width:' + ${d['Placement_Percentage']} + '%'"></div>
                                    </div>
                                    <span class="text-xs font-black text-indigo-600" th:text="${d['Placement_Percentage']} + '%'">0%</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-sm font-black text-emerald-600" th:text="${d['Avg_Package_LPA'] != null ? d['Avg_Package_LPA'] : '—'}">—</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Top Companies -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs">Top Hiring Partners</h3>
                    <span class="text-amber-500 text-lg">🏆</span>
                </div>
                <div class="p-6 space-y-6">
                    <div th:each="c, iter : ${topCompanies}" class="flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center text-sm font-black text-slate-400 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-all" th:text="${iter.index + 1}">1</div>
                            <div>
                                <p class="text-sm font-black text-slate-800" th:text="${c['Company_Name']}">Company</p>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Avg Package: <span th:text="${c['Avg_Package']}">0</span> LPA</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-black text-indigo-600" th:text="${c['Hires']}">0</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hires</p>
                        </div>
                    </div>
                    <div th:if="${topCompanies.isEmpty()}" class="py-12 text-center">
                        <p class="text-slate-400 font-medium italic">No hiring data available yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
